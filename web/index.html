<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>北大附中海口学校 · 三维模型</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <aside id="panel">
      <header>
        <h1>北大附中海口学校</h1>
        <p class="sub">校园三维模型 · 依据 2024 图纸与实景照片</p>
      </header>
      <section>
        <h2>视点</h2>
        <div id="views" class="chips"></div>
      </section>
      <section>
        <h2>图层</h2>
        <label><input type="checkbox" data-layer="building" checked /> 建筑</label>
        <label><input type="checkbox" data-layer="landscape" checked /> 景观</label>
        <label><input type="checkbox" data-layer="site" checked /> 场地</label>
        <label><input type="checkbox" id="labels-toggle" checked /> 名称标注</label>
      </section>
      <section>
        <h2>2024 图纸叠图</h2>
        <select id="overlay"><option value="">不显示</option></select>
        <input id="overlay-opacity" type="range" min="0.1" max="1" step="0.05" value="0.75" aria-label="叠图透明度" />
      </section>
      <p id="status">加载模型…</p>
    </aside>
    <article id="card" hidden>
      <button id="card-close" aria-label="关闭">×</button>
      <h3 id="card-name"></h3>
      <p id="card-sub" class="sub"></p>
      <ul id="card-facts"></ul>
      <p id="card-src" class="src"></p>
    </article>
    <div id="stats" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
